<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoTube</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="header">
        <div class="brand">
          <img class="logo" src="../icons/logo.png" alt="" width="28" height="28" />
          <h1>NoTube</h1>
        </div>

        <label class="switch" title="Enable blocking">
          <input type="checkbox" id="enabled" />
          <span class="switch-track" aria-hidden="true"></span>
          <span class="visually-hidden">Enabled</span>
        </label>
      </header>

      <div class="status inactive" id="status">Inactive now: videos visible</div>

      <section class="schedule">
        <h2>Schedule</h2>
        <div class="time-row">
          <label class="time-field">
            <span class="time-label">From</span>
            <span class="time-input-wrap">
              <svg class="clock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6" />
                <path d="M12 8v4.5l3 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <input type="time" id="startTime" />
            </span>
          </label>
          <label class="time-field">
            <span class="time-label">To</span>
            <span class="time-input-wrap">
              <svg class="clock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6" />
                <path d="M12 8v4.5l3 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <input type="time" id="endTime" />
            </span>
          </label>
        </div>
      </section>

      <label class="checkbox-row">
        <input type="checkbox" id="showMessage" />
        <span class="checkbox-box" aria-hidden="true"></span>
        <span>Show notification</span>
      </label>

      <button type="button" id="save">Save</button>
      <a href="#" id="openOptions">All settings</a>
    </main>
    <script src="../browser-polyfill.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
